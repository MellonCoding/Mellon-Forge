# Mellon Forge VTT — netlify.toml
# Istruzioni di build e routing per Netlify

[build]
  # Cartella da pubblicare (output Tailwind già compilato)
  publish = "."

  # Comando di build: compila Tailwind in produzione
  command = "bash build.sh"

# ── Redirect: tutte le pagine HTML esistono già come file statici
#    ma vogliamo che /login → login.html funzioni senza estensione
[[redirects]]
  from   = "/login"
  to     = "/login.html"
  status = 200

[[redirects]]
  from   = "/campaigns"
  to     = "/campaigns.html"
  status = 200

[[redirects]]
  from   = "/game"
  to     = "/game.html"
  status = 200

# ── Proxy: tutte le chiamate /api/* vengono girate al backend PHP su Railway
#    Sostituisci l'URL con quello del tuo servizio Railway
[[redirects]]
  from   = "/api/*"
  to     = "https://mellon-forge-production.up.railway.app/api/:splat"
  status = 200
  force  = true

  # Header inoltrati al backend
  [redirects.headers]
    X-Forwarded-Host = ":host"

# ── Headers di sicurezza per tutte le pagine
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# ── Cache lunga per assets statici compilati
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"
